# Deploy commerce API + admin to Render (Blueprint).
# dockerContext is /commerce — same layout as create-spree-app.
#
# Dashboard: New → Blueprint → this repo
# Admin after deploy: https://<service>.onrender.com/admin
services:
  - type: web
    name: commonwealth-commerce
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./commerce
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: commonwealth-commerce-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_LOG_LEVEL
        value: info
      - key: MISSION_CONTROL_USER
        value: jobs
      - key: MISSION_CONTROL_PASSWORD
        generateValue: true

databases:
  - name: commonwealth-commerce-db
    plan: free
    databaseName: spree
    postgresMajorVersion: "16"
    ipAllowList: []
