# Commonwealth only — isolated from any other future site blocks.
upstream commonwealth_web {
  server 127.0.0.1:3023;
  keepalive 8;
}

upstream commonwealth_spree {
  server 127.0.0.1:3024;
  keepalive 8;
}

# Shared proxy settings via include would be overkill; keep explicit.

server {
  listen 80;
  listen [::]:80;
  server_name commonwealthseedco.com www.commonwealthseedco.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name commonwealthseedco.com www.commonwealthseedco.com;

  ssl_certificate /etc/ssl/cloudflare/commonwealthseedco.crt;
  ssl_certificate_key /etc/ssl/cloudflare/commonwealthseedco.key;

  client_max_body_size 50M;

  # Spree admin + API + Active Storage + jobs dashboard

  location ^~ /admin_user {
    proxy_pass http://commonwealth_spree;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Ssl on;
    proxy_read_timeout 120s;
  }

  location ^~ /admin {
    proxy_pass http://commonwealth_spree;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Ssl on;
    proxy_read_timeout 120s;
  }

  location ^~ /api {
    proxy_pass http://commonwealth_spree;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }

  location ^~ /rails {
    proxy_pass http://commonwealth_spree;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }


  location ^~ /cable {
    proxy_pass http://commonwealth_spree;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 86400s;
  }

  location ^~ /jobs {
    proxy_pass http://commonwealth_spree;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }

  location ^~ /up {
    proxy_pass http://commonwealth_spree;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Lander assets first; Spree admin assets fall through on 404
  location /assets/ {
    proxy_pass http://commonwealth_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_intercept_errors on;
    error_page 404 = @spree_assets;
  }

  location @spree_assets {
    proxy_pass http://commonwealth_spree;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    proxy_pass http://commonwealth_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }
}
